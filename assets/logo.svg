<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="2.5"/>

  <!-- Radar Grid Circles -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="64" cy="64" r="32" fill="none" stroke="#475569" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="18" fill="none" stroke="#64748B" stroke-width="1.5"/>

  <!-- Crosshairs / Reticle -->
  <line x1="64" y1="12" x2="64" y2="30" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="98" x2="64" y2="116" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="64" x2="30" y2="64" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <line x1="98" y1="64" x2="116" y2="64" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>

  <!-- Radar Sweep Arc -->
  <path d="M 64 64 L 96.5 31.5 A 46 46 0 0 0 64 18 Z" fill="url(#pulseGrad)" opacity="0.6"/>

  <!-- Central Briefcase / Target Icon -->
  <g transform="translate(48, 50)" filter="url(#glow)">
    <!-- Briefcase Handle -->
    <path d="M10 5 C10 2.5 12 1 16 1 C20 1 22 2.5 22 5" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <!-- Briefcase Body -->
    <rect x="4" y="5" width="24" height="18" rx="3.5" fill="#1E293B" stroke="url(#accentGrad)" stroke-width="2"/>
    <!-- Briefcase Lock / Accents -->
    <line x1="4" y1="11" x2="28" y2="11" stroke="#475569" stroke-width="1.5"/>
    <rect x="14" y="10" width="4" height="3" rx="1" fill="#38BDF8"/>
  </g>
</svg>


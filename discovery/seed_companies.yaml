# =============================================================================
# SEED COMPANY LIST: human-curated. Edit freely.
#
# tier:   A = sweet spot (mid-size / scaleup, realistic odds)
#         B = strong (large UK employers, structured intern/placement schemes)
#         C = top / stretch (big tech, AI labs, quant, top fintech)
#         Every tier is polled equally. Tier only sets alert priority.
# hubs:   where I *believe* they hire. probe_ats.py measures the actual job
#         locations, so treat this as a hint, not a fact.
# slugs:  optional extra slug guesses for the ATS probe (name-based guesses
#         are generated automatically).
# clearance: true = roles often need SC/DV vetting (usually British nationality
#         + UK residency). Kept in the list, but flagged on alerts.
# reject: ["type:slug", ...] = feeds the probe matched that belong to a DIFFERENT
#         company with the same slug (e.g. greenhouse:peak is a US physio clinic).
# =============================================================================

